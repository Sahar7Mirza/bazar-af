[project]
name = "bazar-af-api"
version = "1.0.0"
description = "Bazar.af API: marketplace for Kabul MSEs and a mobile-money adoption research module"
requires-python = ">=3.11"
# Keep in step with requirements.txt (used by Docker and CI). Vercel reads this list.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false  # an application, not an installable library

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP042"]  # FastAPI Depends()/Query() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E501"]

# Vercel (serverless) deployment: migrations run at build time because there is no long-running start script.
[tool.vercel.scripts]
build = "python scripts/vercel_build.py"
