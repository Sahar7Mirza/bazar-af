name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: bazaraf, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: bazaraf_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bazaraf" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://bazaraf:ci-only-password@localhost:5432/bazaraf_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env: { API_URL: "http://localhost:8000/api/v1" }

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: bazaraf, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: bazaraf }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bazaraf" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bazaraf:ci-only-password@localhost:5432/bazaraf
      ENVIRONMENT: development
      SEED_PASSWORD: Ci-Demo-Only-2026
      E2E_PASSWORD: Ci-Demo-Only-2026
      API_URL: http://localhost:8000/api/v1
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start API with demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.seed --reset
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
      - name: Build and start web
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # the standalone server needs the static assets and public/ beside it (the Dockerfile does the same)
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          nohup node .next/standalone/server.js > ../web.log 2>&1 &
          npx playwright install --with-deps chromium
        env: { PORT: "3000", HOSTNAME: "0.0.0.0" }
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/health && curl -sf -o /dev/null localhost:3000/login && exit 0; sleep 2; done
          cat api.log web.log; exit 1
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }
